name: Fetch anime covers

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch-posters.js'
      - 'index.html'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download cover art
        run: node scripts/fetch-posters.js
      - name: Commit covers
        run: |
          git config user.name "Kori Builder"
          git config user.email "kori@local.dev"
          git add posters.js assets/posters
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Refresh anime cover art"; git push; fi
